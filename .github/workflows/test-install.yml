name: Test Install

on:
  pull_request:
    paths:
      - "crates/databasectl/src/main.rs"
      - "crates/databasectl/src/cli.rs"
      - "crates/databasectl/src/local/cli.rs"
      - "crates/databasectl/src/local/clickhouse.rs"
      - "crates/databasectl/src/local/mod.rs"
      - "crates/databasectl/src/local/output.rs"
      - "crates/databasectl/src/local/server.rs"
      - "crates/databasectl/src/init.rs"
      - "crates/databasectl/src/paths.rs"
      - "crates/databasectl/src/error.rs"
      - "crates/databasectl/src/http.rs"
      - "crates/databasectl/src/user_agent.rs"
      - "crates/databasectl/tests/local_clickhouse_docker_test.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/databasectl/Cargo.toml"
      - "scripts/classify-install-integration.py"
      - "scripts/tests/test_classify_install_integration.py"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/test-cli.yml"

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify install workflow path mapping
        run: python3 scripts/tests/test_classify_install_integration.py
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
      - run: cargo test

  image-install-test:
    name: Image Install Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27

      - name: Build CLI
        run: cargo build

      - name: Test image pre-pull
        run: |
          ./target/debug/dctl local install 26.8
          docker image inspect clickhouse/clickhouse-server:26.8 > /dev/null

      - name: Test already pulled (skips the pull)
        run: |
          ./target/debug/dctl local install 26.8 2>&1 | grep "already pulled"

      - name: Test force re-pull
        run: ./target/debug/dctl local install 26.8 --force

      - name: Test engine selector pre-pull
        run: |
          ./target/debug/dctl local install postgres@18
          docker image inspect postgres:18 > /dev/null

      - name: Test invalid tag (expect error)
        run: |
          if ./target/debug/dctl local install foo 2>&1; then
            echo "Should have errored for invalid tag"
            exit 1
          fi

      - name: Test bare-major tag rejected (expect error)
        run: |
          if ./target/debug/dctl local install 25 2>&1; then
            echo "Should have errored for a single-segment tag"
            exit 1
          fi
