name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Verify static linking
        if: contains(matrix.target, 'linux-musl')
        run: |
          binary="target/${{ matrix.target }}/release/dctl"
          echo "--- file output ---"
          file "$binary"
          file "$binary" | grep -qE "statically linked|static-pie linked"
          echo "--- ldd output ---"
          ldd_output=$(ldd "$binary" 2>&1 || true)
          echo "$ldd_output"
          echo "$ldd_output" | grep -qE "not a dynamic executable|statically linked"
          echo "Static linking verified."

      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          DIR="dctl-${TARGET}-v${VERSION}"
          mkdir "$DIR"
          cp "target/${TARGET}/release/dctl" "$DIR/"
          tar -czf "${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dctl-${{ matrix.target }}-v${{ steps.version.outputs.version }}
          path: dctl-${{ matrix.target }}-v${{ steps.version.outputs.version }}.tar.gz

  smoke-test:
    name: Smoke test (${{ matrix.distro }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bullseye
          - debian:bookworm
          - centos:7
          - amazonlinux:2
          - alpine:3.18
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Compute version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dctl-${{ env.TARGET }}-v${{ steps.version.outputs.version }}

      - name: Extract archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="dctl-${TARGET}-v${VERSION}"
          tar -xzf "${DIR}.tar.gz"
          chmod +x "${DIR}/dctl"
          echo "BIN_PATH=${PWD}/${DIR}/dctl" >> "$GITHUB_ENV"

      - name: Run smoke test in ${{ matrix.distro }}
        run: |
          docker run --rm \
            -v "${BIN_PATH}:/usr/local/bin/dctl:ro" \
            ${{ matrix.distro }} \
            sh -c 'dctl --version && dctl --help'

  release:
    name: Create Release
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir release
          for dir in artifacts/dctl-*-v*/; do
            cp "$dir"/*.tar.gz release/
          done
          # Integrity anchor for `dctl update` (health review F-06): the
          # updater verifies the archive digest against this file and
          # refuses a mismatch before extracting anything.
          cd release && sha256sum *.tar.gz > SHA256SUMS
          ls -l

      - name: Collect default image digest manifest
        # Fleet distribution contract (ai_ccoe/actl): every release carries
        # the default engine images pinned by digest so the private registry
        # can pre-mirror them. The list mirrors the source defaults
        # (DEFAULT_CH_TAG / DEFAULT_FK_TAG / postgres majors); update it in
        # the same PR that changes a default.
        run: |
          {
            echo "# dctl ${GITHUB_REF_NAME} default image manifest (name:tag@digest)"
            echo "# Authority: crates/databasectl/src/local/{clickhouse,falkordb,postgres}.rs"
            echo "# The alpine image backs the privileged data-dir cleanup path."
            for image in \
              clickhouse/clickhouse-server:26.8 \
              falkordb/falkordb:v4.20.6 \
              falkordb/falkordb:latest \
              postgres:18 \
              postgres:17 \
              postgres:18-alpine \
              postgres:17-alpine \
              alpine:latest
            do
              digest=$(docker manifest inspect "$image" 2>/dev/null \
                | grep -m1 '"digest"' | sed 's/.*: //;s/"//')
              if [ -n "$digest" ]; then
                echo "$image@$digest"
              else
                echo "# UNRESOLVED: $image" >&2
              fi
            done
          } > IMAGES.txt
          cat IMAGES.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes release/* IMAGES.txt

